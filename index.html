<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Expense Tracker — Local HTML (Tailwind + Highcharts)</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Highcharts CDN -->
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://code.highcharts.com/modules/variable-pie.js"></script>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    /* Soft fade & scale modal animation (Option A) */
    .modal-backdrop {
      transition: opacity .22s ease;
    }
    .modal-card {
      transform-origin: center center;
      transition: transform .22s cubic-bezier(.2,.9,.3,1), opacity .2s ease;
    }
    .modal-open .modal-backdrop { opacity: 1; pointer-events: auto; }
    .modal-open .modal-card { transform: translateY(0) scale(1); opacity: 1; }
    .modal-closed .modal-backdrop { opacity: 0; pointer-events: none; }
    .modal-closed .modal-card { transform: translateY(-10px) scale(.98); opacity: 0; }

    /* small toast */
    .toast-enter { transform: translateY(10px); opacity: 0; }
    .toast-show { transform: translateY(0); opacity: 1; transition: all .32s ease; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen text-gray-800">

  <main class="container mx-auto p-6 max-w-6xl">
    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-3xl font-bold">Expense Tracker</h1>
        <p class="text-sm text-gray-600">A simple local HTML project — Tailwind + Highcharts + localStorage</p>
      </div>
      <div class="text-right">
        <div class="text-sm text-gray-600">Hello, <span id="userName">Student</span></div>
        <div class="text-xs text-gray-400">Local demo</div>
      </div>
    </header>

    <!-- Budget / Summary cards -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-5 rounded-lg shadow-sm">
        <div class="text-sm text-gray-500">Total Budget</div>
        <div id="totalBudget" class="text-2xl font-semibold mt-2">Rs 0</div>
      </div>
      <div class="bg-white p-5 rounded-lg shadow-sm">
        <div class="text-sm text-gray-500">Total Expense</div>
        <div id="totalExpense" class="text-2xl font-semibold mt-2">Rs 0</div>
      </div>
      <div class="bg-white p-5 rounded-lg shadow-sm">
        <div class="text-sm text-gray-500">Remaining Budget</div>
        <div id="remainingBudget" class="text-2xl font-semibold mt-2">Rs 0</div>
      </div>
    </section>

    <!-- Actions -->
    <section class="flex gap-3 mb-6">
      <button id="btnAddExpense" class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded shadow hover:bg-blue-700">
        <i class="fa fa-plus-circle"></i> Add Expense
      </button>
      <button id="btnAddBudget" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded shadow hover:bg-indigo-700">
        <i class="fa fa-wallet"></i> Set Budget
      </button>
      <button id="btnReset" class="ml-auto text-sm px-3 py-2 bg-gray-100 rounded hover:bg-gray-200">
        Reset Sample Data
      </button>
    </section>

    <!-- Charts & List -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white rounded-lg p-5 shadow">
        <h3 class="font-semibold mb-4">Expense Chart</h3>
        <div id="pieChart" style="height:340px;"></div>
      </div>

      <div class="bg-white rounded-lg p-5 shadow flex flex-col">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold">Expenses Tracker</h3>
          <div class="text-sm text-gray-500">Click Edit/Delete on items</div>
        </div>

        <div id="expensesList" class="space-y-3 overflow-auto max-h-80">
          <!-- list items inserted by JS -->
        </div>
      </div>
    </section>

    <section class="bg-white rounded-lg p-5 shadow mt-6">
      <h3 class="font-semibold mb-4">Monthly Expenses (Category-wise)</h3>
      <div id="barChart" style="height:300px;"></div>
    </section>
  </main>

  <!-- Modal Backdrop / Container (single reusable structure) -->
  <div id="modalRoot" class="fixed inset-0 flex items-center justify-center z-50 pointer-events-none">
    <div id="modalBackdrop" class="absolute inset-0 bg-black bg-opacity-40 modal-backdrop modal-closed"></div>

    <div id="modalCard" class="relative modal-card modal-closed w-full max-w-md mx-4">
      <!-- content injected by JS -->
    </div>
  </div>

  <!-- Toast container -->
  <div id="toastContainer" class="fixed right-4 top-6 z-50 space-y-2"></div>

  <script>
  /*************************************************************************
   * Expense Tracker — Single-file HTML (no frameworks)
   * - localStorage used to persist data under key: 'et_data_v1'
   * - sample data seeded on first run (or via Reset Sample Data)
   * - modals use soft fade & scale animations (Option A)
   *************************************************************************/

  // ----- Config & Helpers -----
  const STORAGE_KEY = 'et_data_v1';

  const COLORS = {
    'Travel': '#3B82F6',
    'Groceries': '#10B981',
    'Food & Drink': '#F59E0B',
    'Health': '#EF4444',
    'Other': '#8B5CF6'
  };

  const ui = {
    totalBudget: document.getElementById('totalBudget'),
    totalExpense: document.getElementById('totalExpense'),
    remainingBudget: document.getElementById('remainingBudget'),
    expensesList: document.getElementById('expensesList'),
    pieChartEl: document.getElementById('pieChart'),
    barChartEl: document.getElementById('barChart'),
    userName: document.getElementById('userName'),
    modalRoot: document.getElementById('modalRoot'),
    modalBackdrop: document.getElementById('modalBackdrop'),
    modalCard: document.getElementById('modalCard'),
    toastContainer: document.getElementById('toastContainer'),
    btnAddExpense: document.getElementById('btnAddExpense'),
    btnAddBudget: document.getElementById('btnAddBudget'),
    btnReset: document.getElementById('btnReset')
  };

  // Data shape: { userName, budget: number, expenses: [{id, name, category, amount, date}] }
  let state = {
    userName: 'Munaf Hajir',
    budget: 0,
    expenses: []
  };

  // Highcharts instances
  let pieChart = null;
  let barChart = null;

  // ----- Sample data -----
  const SAMPLE = {
    userName: 'Munaf Hajir',
    budget: 20000,
    expenses: [
      { id: 1, name: 'Pizza with friends', category: 'Food & Drink', amount: 499.00, date: '2025-10-15' },
      { id: 2, name: 'Grocery shopping', category: 'Groceries', amount: 1200.00, date: '2025-10-10' },
      { id: 3, name: 'Auto travel', category: 'Travel', amount: 850.00, date: '2025-09-20' },
      { id: 4, name: 'Medicines', category: 'Health', amount: 320.00, date: '2025-09-22' },
      { id: 5, name: 'Coffee & snacks', category: 'Food & Drink', amount: 150.00, date: '2025-10-01' }
    ]
  };

  // Utility: format currency
  function fmt(amount) {
    if (isNaN(amount)) return 'Rs 0';
    return 'Rs ' + Number(amount).toLocaleString();
  }

  // Toast helper
  function showToast(text, opts = {}) {
    const id = 't' + Date.now();
    const node = document.createElement('div');
    node.id = id;
    node.className = 'bg-white px-4 py-2 rounded shadow-sm flex items-center gap-3 toast-enter';
    node.style.width = opts.width || '260px';
    node.innerHTML = `<div class="text-sm">${text}</div>`;
    ui.toastContainer.appendChild(node);
    // show
    requestAnimationFrame(() => node.classList.add('toast-show'));
    // auto remove
    setTimeout(() => {
      node.remove();
    }, opts.duration || 2400);
  }

  // ----- Persistence -----
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        // seed with sample
        state = JSON.parse(JSON.stringify(SAMPLE));
        saveState();
      } else {
        state = JSON.parse(raw);
      }
    } catch (err) {
      console.error('Error loading state', err);
      state = JSON.parse(JSON.stringify(SAMPLE));
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function resetToSample() {
    localStorage.removeItem(STORAGE_KEY);
    loadState();
    renderAll();
    showToast('Reset to sample data');
  }

  // ----- UI rendering -----
  function renderSummary() {
    const totalExpense = state.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
    ui.totalBudget.textContent = fmt(state.budget);
    ui.totalExpense.textContent = fmt(totalExpense);
    ui.remainingBudget.textContent = fmt(state.budget - totalExpense);
    ui.userName.textContent = state.userName || 'Student';
  }

  function renderExpensesList() {
    const container = ui.expensesList;
    container.innerHTML = '';

    if (!state.expenses || state.expenses.length === 0) {
      container.innerHTML = '<p class="text-center text-sm text-gray-500 py-6">No expenses yet. Add your first expense!</p>';
      return;
    }

    // sort newest first
    const arr = [...state.expenses].sort((a,b) => b.id - a.id);
    for (const exp of arr) {
      const el = document.createElement('div');
      el.className = 'flex items-center justify-between p-3 bg-gray-50 rounded shadow-sm';
      el.innerHTML = `
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background:${(COLORS[exp.category]||'#e2e8f0')}22">
            <i class="fa fa-receipt text-sm" style="color:${COLORS[exp.category]||'#6b7280'}"></i>
          </div>
          <div>
            <div class="font-medium">${escapeHtml(exp.name)}</div>
            <div class="text-xs text-gray-500">${escapeHtml(exp.date)}</div>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="font-semibold">${fmt(exp.amount)}</div>
          <button class="text-blue-600 hover:bg-blue-50 p-2 rounded" onclick="openEditModal(${exp.id})" title="Edit">
            <i class="fa fa-edit"></i>
          </button>
          <button class="text-red-600 hover:bg-red-50 p-2 rounded" onclick="openDeleteModal(${exp.id})" title="Delete">
            <i class="fa fa-trash"></i>
          </button>
        </div>
      `;
      container.appendChild(el);
    }
  }

  function escapeHtml(str='') {
    return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
  }

  // ----- Charts -----
  function initCharts() {
    // Pie chart
    pieChart = Highcharts.chart(ui.pieChartEl, {
      chart: { type: 'variablepie', height: 340, backgroundColor: 'transparent' },
      title: { text: '' },
      tooltip: { pointFormat: '{series.name}: <b>Rs {point.y}</b>' },
      series: [{ minPointSize: 10, innerSize: '50%', name: 'Expenses', data: [] }]
    });

    // Bar chart (category totals)
    barChart = Highcharts.chart(ui.barChartEl, {
      chart: { type: 'column', height: 300, backgroundColor: 'transparent' },
      title: { text: '' },
      xAxis: { categories: Object.keys(COLORS) },
      yAxis: { title: { text: 'Amount (Rs)' } },
      series: [{ name: 'Amount', data: [], colorByPoint: true }]
    });

    updateCharts();
  }

  function updateCharts() {
    // aggregate by category
    const stats = {};
    for (const c of Object.keys(COLORS)) stats[c] = 0;
    for (const e of state.expenses) {
      const cat = e.category || 'Other';
      if (!stats[cat]) stats[cat] = 0;
      stats[cat] += Number(e.amount || 0);
    }

    // pie data
    const pieData = [];
    for (const [k,v] of Object.entries(stats)) {
      if (v > 0) {
        pieData.push({ name: k, y: v, color: COLORS[k] || '#8B5CF6' });
      }
    }
    if (pieData.length === 0) {
      pieData.push({ name: 'No data', y: 1, color: '#E5E7EB' });
    }
    if (pieChart && pieChart.series && pieChart.series[0]) {
      pieChart.series[0].setData(pieData);
    }

    // bar data (ensure same category order)
    const barData = Object.keys(COLORS).map(k => Math.round((stats[k] || 0) * 100) / 100);
    if (barChart && barChart.series && barChart.series[0]) {
      barChart.series[0].setData(barData);
      barChart.xAxis[0].setCategories(Object.keys(COLORS));
      barChart.update({ series: [{ data: barData, colorByPoint: true }] }, true, true);
    }
  }

  // ----- Modals (soft fade & scale) -----
  function showModal(contentHtml) {
    ui.modalCard.innerHTML = '';
    ui.modalCard.insertAdjacentHTML('beforeend', contentHtml);

    // switch classes to "open"
    ui.modalRoot.classList.add('modal-open');
    ui.modalRoot.classList.remove('modal-closed');
    // Ensure clickable backdrop
    ui.modalRoot.style.pointerEvents = 'auto';
    // add key listener for ESC
    document.addEventListener('keydown', modalEscHandler);
  }

  function hideModal() {
    ui.modalRoot.classList.remove('modal-open');
    ui.modalRoot.classList.add('modal-closed');
    ui.modalRoot.style.pointerEvents = 'none';
    ui.modalCard.innerHTML = '';
    document.removeEventListener('keydown', modalEscHandler);
  }

  function modalEscHandler(e) {
    if (e.key === 'Escape') hideModal();
  }

  // Close modal when backdrop clicked
  ui.modalBackdrop.addEventListener('click', hideModal);

  // ----- Modal Contents & Actions -----
  function openAddExpenseModal() {
    const html = `
      <div class="bg-white rounded-lg p-6 shadow-lg">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold">Add Expense</h3>
          <button onclick="hideModal()" class="text-gray-400 hover:text-gray-600"><i class="fa fa-times text-xl"></i></button>
        </div>
        <div class="space-y-3">
          <label class="block text-sm">Name <input id="m_name" class="mt-1 w-full border px-3 py-2 rounded" /></label>
          <label class="block text-sm">Date <input id="m_date" type="date" class="mt-1 w-full border px-3 py-2 rounded" /></label>
          <label class="block text-sm">Category
            <select id="m_category" class="mt-1 w-full border px-3 py-2 rounded">
              ${Object.keys(COLORS).map(c => `<option value="${c}">${c}</option>`).join('')}
            </select>
          </label>
          <label class="block text-sm">Amount <input id="m_amount" type="number" step="0.01" min="0" class="mt-1 w-full border px-3 py-2 rounded" /></label>
          <div class="flex gap-3 mt-4">
            <button class="flex-1 bg-blue-600 text-white py-2 rounded" onclick="addExpenseFromModal()">Add Expense</button>
            <button class="flex-1 bg-gray-100 py-2 rounded" onclick="hideModal()">Cancel</button>
          </div>
        </div>
      </div>
    `;
    showModal(html);
  }

  function addExpenseFromModal() {
    const name = document.getElementById('m_name').value.trim();
    const date = document.getElementById('m_date').value;
    const category = document.getElementById('m_category').value;
    const amount = parseFloat(document.getElementById('m_amount').value);

    if (!name || !date || !category || isNaN(amount) || amount <= 0) {
      showToast('Please fill all fields with valid values', { duration: 2200 });
      return;
    }

    const id = Date.now();
    state.expenses.push({ id, name, category, amount, date });
    saveState();
    renderAll();
    hideModal();
    showToast('Expense added');
  }

  // Edit
  function openEditModal(id) {
    const exp = state.expenses.find(e => e.id === id);
    if (!exp) return showToast('Expense not found', { duration: 2000 });
    const html = `
      <div class="bg-white rounded-lg p-6 shadow-lg">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold">Edit Expense</h3>
          <button onclick="hideModal()" class="text-gray-400 hover:text-gray-600"><i class="fa fa-times text-xl"></i></button>
        </div>
        <div class="space-y-3">
          <label class="block text-sm">Name <input id="me_name" value="${escapeHtml(exp.name)}" class="mt-1 w-full border px-3 py-2 rounded" /></label>
          <label class="block text-sm">Date <input id="me_date" type="date" value="${exp.date}" class="mt-1 w-full border px-3 py-2 rounded" /></label>
          <label class="block text-sm">Category
            <select id="me_category" class="mt-1 w-full border px-3 py-2 rounded">
              ${Object.keys(COLORS).map(c => `<option ${c===exp.category?'selected':''} value="${c}">${c}</option>`).join('')}
            </select>
          </label>
          <label class="block text-sm">Amount <input id="me_amount" type="number" step="0.01" min="0" value="${exp.amount}" class="mt-1 w-full border px-3 py-2 rounded" /></label>
          <div class="flex gap-3 mt-4">
            <button class="flex-1 bg-green-600 text-white py-2 rounded" onclick="saveEditedExpense(${id})">Update</button>
            <button class="flex-1 bg-gray-100 py-2 rounded" onclick="hideModal()">Cancel</button>
          </div>
        </div>
      </div>
    `;
    showModal(html);
  }

  function saveEditedExpense(id) {
    const name = document.getElementById('me_name').value.trim();
    const date = document.getElementById('me_date').value;
    const category = document.getElementById('me_category').value;
    const amount = parseFloat(document.getElementById('me_amount').value);

    if (!name || !date || !category || isNaN(amount) || amount <= 0) {
      showToast('Please fill all fields with valid values', { duration: 2200 });
      return;
    }

    const idx = state.expenses.findIndex(e => e.id === id);
    if (idx === -1) return showToast('Expense not found');

    state.expenses[idx] = { id, name, category, amount, date };
    saveState();
    renderAll();
    hideModal();
    showToast('Expense updated');
  }

  // Delete confirm
  function openDeleteModal(id) {
    const html = `
      <div class="bg-white rounded-lg p-6 shadow-lg">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold">Delete Expense</h3>
          <button onclick="hideModal()" class="text-gray-400 hover:text-gray-600"><i class="fa fa-times text-xl"></i></button>
        </div>
        <div class="text-center">
          <div class="mx-auto w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mb-3">
            <i class="fa fa-exclamation-triangle text-red-600 text-2xl"></i>
          </div>
          <p class="mb-4">Are you sure you want to delete this expense? This action cannot be undone.</p>
          <div class="flex gap-3">
            <button class="flex-1 bg-gray-100 py-2 rounded" onclick="hideModal()">Cancel</button>
            <button class="flex-1 bg-red-600 text-white py-2 rounded" onclick="confirmDelete(${id})">Delete</button>
          </div>
        </div>
      </div>
    `;
    showModal(html);
  }

  function confirmDelete(id) {
    state.expenses = state.expenses.filter(e => e.id !== id);
    saveState();
    renderAll();
    hideModal();
    showToast('Deleted');
  }

  // Budget modal
  function openSetBudgetModal() {
    const html = `
      <div class="bg-white rounded-lg p-6 shadow-lg">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold">Set Budget</h3>
          <button onclick="hideModal()" class="text-gray-400 hover:text-gray-600"><i class="fa fa-times text-xl"></i></button>
        </div>
        <div class="space-y-3">
          <label class="block text-sm">Amount <input id="mb_amount" type="number" min="0" step="0.01" value="${state.budget}" class="mt-1 w-full border px-3 py-2 rounded" /></label>
          <div class="flex gap-3 mt-4">
            <button class="flex-1 bg-indigo-600 text-white py-2 rounded" onclick="setBudgetFromModal()">Set Budget</button>
            <button class="flex-1 bg-gray-100 py-2 rounded" onclick="hideModal()">Cancel</button>
          </div>
        </div>
      </div>
    `;
    showModal(html);
  }

  function setBudgetFromModal() {
    const v = parseFloat(document.getElementById('mb_amount').value);
    if (isNaN(v) || v < 0) { showToast('Enter a valid amount'); return; }
    state.budget = v;
    saveState();
    renderAll();
    hideModal();
    showToast('Budget set');
  }

  // ----- Render all -----
  function renderAll() {
    renderSummary();
    renderExpensesList();
    updateCharts();
  }

  // ----- Wiring events -----
  ui.btnAddExpense.addEventListener('click', openAddExpenseModal);
  ui.btnAddBudget.addEventListener('click', openSetBudgetModal);
  ui.btnReset.addEventListener('click', () => {
    if (confirm('Reset to sample data?')) resetToSample();
  });

  // ----- Initialize -----
  function init() {
    loadState();
    initCharts();
    renderAll();
    // Add subtle open class toggles for modalRoot to enable animation states
    // Start closed
    ui.modalRoot.classList.add('modal-closed');
  }

  // Kick-off
  init();

  // Expose some functions for inline onclick handlers (edit/delete)
  window.openEditModal = openEditModal;
  window.openDeleteModal = openDeleteModal;
  window.openAddExpenseModal = openAddExpenseModal;
  window.openDeleteModal = openDeleteModal;
  window.openSetBudgetModal = openSetBudgetModal;
  window.resetToSample = resetToSample;

  </script>
</body>
</html>
